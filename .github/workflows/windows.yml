name: Gerar aplicativo Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build:windows
      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist/SpaceInvaders-Windows -DestinationPath dist/SpaceInvaders-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceInvaders-Windows
          path: dist/SpaceInvaders-Windows.zip
      - name: Publicar Release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/SpaceInvaders-Windows.zip --generate-notes

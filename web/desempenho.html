<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de exércitos · SpaceInvaders</title><style>body{margin:0;background:#071725;color:#d7ecff;font:15px system-ui}aside{position:absolute;top:12px;left:12px;padding:18px;background:#071b2bee;z-index:1;max-width:420px}a{color:#8ee8ff}button{padding:10px 18px;background:#215879;color:white;border:1px solid #75b6d9}td,th{padding:7px 12px;text-align:left}p{line-height:1.5;font-size:13px}</style><aside><a href="./">← Jogo</a><h1>Teste de exércitos</h1><p>Teste gráfico de 30, 80 e 160 modelos animados com o carregador do jogo. Mede renderização e animação; não inclui terreno, inteligência dos inimigos ou rede.</p><button id="start">Iniciar teste</button><p id="status">Pronto.</p><table><thead><tr><th>Unidades</th><th>FPS</th><th>ms/quadro</th><th>Triângulos</th></tr></thead><tbody></tbody></table></aside><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script><script type="module">
import{setModelDetail}from'./model-detail.mjs';import * as T from 'three';import{attachGameModel,updateGameAnimation}from'./media.mjs';
const scene=new T.Scene(),camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,500),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);scene.background=new T.Color(0x071725);scene.add(new T.HemisphereLight(0xe1f3ff,0x253343,2.4));const light=new T.DirectionalLight(0xffe8d0,3);light.position.set(20,60,40);scene.add(light);scene.add(new T.GridHelper(100,40,0x48758b,0x1a3646));camera.position.set(48,65,74);camera.lookAt(0,0,0);const entities=[];let running=false;const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
document.querySelector('button').onclick=async()=>{if(running)return;running=true;document.querySelector('button').disabled=true;const status=document.querySelector('#status');try{for(const count of [30,80,160]){status.textContent='Carregando '+count+' unidades…';for(let i=entities.length;i<count;i++){const mesh=new T.Group(),x=(i%16-7.5)*5,z=(Math.floor(i/16)-4.5)*5;mesh.position.set(x,0,z);scene.add(mesh);const e={id:i,x,z,mesh,type:'soldier',faction:['solar','aether','swarm'][i%3],alive:true,team:0,hp:100,maxHp:100};entities.push(e);await attachGameModel(e,()=>true);}for(const e of entities){e.mesh.visible=e.id<count;setModelDetail(e,true)}for(let j=0;j<5;j++){renderer.render(scene,camera);await frame()}const samples=[];let last=await frame();for(let j=0;j<35;j++){for(const e of entities){e.x+=.02;updateGameAnimation(e,1/30)}renderer.render(scene,camera);const now=await frame();samples.push(now-last);last=now}samples.sort((a,b)=>a-b);const median=samples[Math.floor(samples.length/2)],row=document.createElement('tr');row.innerHTML='<td>'+count+'</td><td>'+(1000/median).toFixed(1)+'</td><td>'+median.toFixed(1)+'</td><td>'+renderer.info.render.triangles.toLocaleString('pt-BR')+'</td>';document.querySelector('tbody').append(row)}status.textContent='Teste concluído. Resultados desta máquina e janela.';}catch(e){status.textContent='Falha: '+e.message;console.error(e)}finally{running=false}};
renderer.render(scene,camera);
</script></html>

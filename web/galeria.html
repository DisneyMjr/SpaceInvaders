*{box-sizing:border-box}body{margin:0;background:#08111e;color:#e8fff8;font:15px system-ui}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:26px;letter-spacing:.05em;margin:8px 0}p{color:#a9bdce;line-height:1.5}a{color:#71e4d1}section{background:#101f30;border:1px solid #28465e;border-radius:14px;padding:16px;margin:16px 0}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}button,select{font:inherit;border:1px solid #41627a;background:#152d43;color:#e8fff8;padding:10px;border-radius:8px}button{cursor:pointer}button:hover{border-color:#74e7d3}button:focus-visible,select:focus-visible{outline:2px solid #74e7d3;outline-offset:2px}#models{display:flex;flex-direction:column;gap:7px;max-height:630px;overflow:auto}#models button{text-align:left}#models button.active{background:#17464b;border-color:#74e7d3}#viewer{height:500px;border-radius:10px;overflow:hidden;background:#09131e}#viewer canvas{display:block;width:100%;height:100%}label{display:inline-flex;flex-direction:column;gap:7px;margin:8px 12px 8px 0}#status{min-height:22px;color:#8be5d4}#details{color:#a9bdce}#sounds{display:flex;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:700px){main{padding:14px}.layout{grid-template-columns:1fr}#models{flex-direction:row;max-height:110px}#models button{min-width:135px}#viewer{height:360px}header{align-items:start}h1{font-size:21px}}
</style><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body><main><header><div><h1>SPACEINVADERS · HANGAR</h1><p>Explore as variantes personalizadas, suas animações e os efeitos de áudio.</p></div><a href="./">Jogar SpaceInvaders</a></header><div class="layout"><section><div id="models"></div></section><section><div id="viewer"></div><h2 id="title">Selecione um modelo</h2><p id="status" role="status"></p><p id="details"></p><label>Animação<select id="animation"><option>—</option></select></label><label>Visualização<select id="rotation"><option value="1">Girar lentamente</option><option value="0">Manter parado</option></select></label></section></div><section><h2>Efeitos de áudio</h2><div id="sounds"><select id="sound"></select><button id="play">Ouvir</button><button id="stop">Parar áudio</button></div></section></main><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{modelAssets,soundAssets}from'./assets/registry.mjs';
const $=s=>document.querySelector(s),host=$('#viewer'),scene=new THREE.Scene();scene.background=new THREE.Color(0x09131e);const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(9,6,12);camera.lookAt(0,2.4,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));host.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdcefff,0x273343,2.4));const key=new THREE.DirectionalLight(0xfff2da,3);key.position.set(4,10,7);scene.add(key);const fill=new THREE.DirectionalLight(0x82bfff,2);fill.position.set(-7,4,-3);scene.add(fill);scene.add(new THREE.GridHelper(16,16,0x30546a,0x142c3e));const loader=new GLTFLoader(),clock=new THREE.Clock();let model,mixer,action,clips=[],request=0,audio;
const resize=()=>{const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()};new ResizeObserver(resize).observe(host);resize();
function release(){if(!model)return;mixer?.stopAllAction();scene.remove(model);model.traverse(o=>{o.geometry?.dispose();for(const m of Array.isArray(o.material)?o.material:[o.material])if(m){for(const value of Object.values(m))if(value?.isTexture)value.dispose();m.dispose()}});model=null}
async function show(def,button){const mine=++request;$('#status').textContent='Carregando modelo e texturas…';$('#title').textContent=def.label||button.textContent;try{const gltf=await loader.loadAsync(def.path);if(mine!==request)return;release();model=gltf.scene;model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3()),scale=6/Math.max(size.x,size.y,size.z);model.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);model.scale.setScalar(scale);scene.add(model);clips=gltf.animations;mixer=new THREE.AnimationMixer(model);$('#animation').innerHTML='';for(let i=0;i<clips.length;i++){const opt=document.createElement('option');opt.value=i;opt.textContent=clips[i].name;$('#animation').append(opt)}const idle=Math.max(0,clips.findIndex(c=>/stand|idle/i.test(c.name)));$('#animation').value=idle;animateClip(idle);let meshes=0,textures=new Set;model.traverse(o=>{if(o.isMesh){meshes++;for(const m of Array.isArray(o.material)?o.material:[o.material])for(const v of Object.values(m||{}))if(v?.isTexture)textures.add(v.uuid)}});$('#details').textContent=`${meshes} partes • ${textures.size} texturas • ${clips.length} animações`;$('#status').textContent='Modelo carregado.';for(const b of $('#models').children)b.classList.toggle('active',b===button)}catch(e){$('#status').textContent='Falha ao carregar: '+e.message}}
function animateClip(index){if(!clips[index])return;action?.stop();action=mixer.clipAction(clips[index]);action.play()}
$('#animation').onchange=e=>animateClip(Number(e.target.value));const seen=new Set;for(const [role,value]of Object.entries(modelAssets)){const def=typeof value==='string'?{path:value}:value;if(seen.has(def.path))continue;seen.add(def.path);const b=document.createElement('button');b.textContent=def.label||role;b.onclick=()=>show(def,b);$('#models').append(b)}$('#models').firstElementChild?.click();
const soundLabels={shot_solar:'Arma · Terran',shot_aether:'Arma · Protoss',shot_swarm:'Arma · Zerg',select_solar:'Seleção · Marine',select_aether:'Seleção · Zealot',select_swarm:'Chamada · Zergling',train_solar:'Pronto · Marine',train_aether:'Pronto · Zealot',train_swarm:'Pronto · Zergling'};
for(const[kind,value]of Object.entries(soundAssets)){for(const [i,path]of(Array.isArray(value)?value:[value]).entries()){const o=document.createElement('option');o.value=path;o.textContent=`${soundLabels[kind]||kind} · ${i+1}`;$('#sound').append(o)}}$('#play').onclick=()=>{audio?.pause();if(!$('#sound').value)return;audio=new Audio($('#sound').value);audio.volume=.4;audio.play().catch(e=>$('#status').textContent='Não foi possível tocar: '+e.message)};$('#stop').onclick=()=>audio?.pause();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);mixer?.update(dt);if(model&&$('#rotation').value==='1')model.rotation.y+=dt*.15;renderer.render(scene,camera)}frame();
